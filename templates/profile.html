{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h4 class="font-bold text-slate-800 mb-4">User Profile</h4>
        <form method="POST" action="{{ url_for('profile') }}" class="space-y-4">
            <input type="hidden" name="action" value="update_profile">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Username</label>
                <input type="text" name="username" value="{{ current_user.username }}" required class="w-full px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Email (Read Only)</label>
                <input type="email" value="{{ current_user.email }}" readonly class="w-full px-4 py-2 text-sm border border-slate-200 bg-slate-50 text-slate-400 rounded-lg">
            </div>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-4 py-2 rounded-lg transition">Save Profile</button>
        </form>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h4 class="font-bold text-slate-800 mb-4">Change Password</h4>
        <form method="POST" action="{{ url_for('profile') }}" class="space-y-4">
            <input type="hidden" name="action" value="change_password">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Old Password</label>
                <input type="password" name="old_password" required class="w-full px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">New Password</label>
                <input type="password" name="new_password" required class="w-full px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white font-semibold text-sm px-4 py-2 rounded-lg transition">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
