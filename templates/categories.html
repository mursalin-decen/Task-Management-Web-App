{% extends 'base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
        <h4 class="font-bold text-slate-800 mb-4">Add Category</h4>
        <form method="POST" action="{{ url_for('categories') }}" class="flex space-x-3">
            <input type="text" name="name" placeholder="Category Name..." required class="flex-grow px-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-2 rounded-lg transition">Add</button>
        </form>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-800">Categories</div>
        <div class="divide-y divide-slate-100">
            {% for cat in categories %}
            <div class="p-4 sm:px-6 flex justify-between items-center">
                <span class="font-medium text-slate-700"><i class="fa-solid fa-tag text-indigo-400 mr-2"></i>{{ cat.name }}</span>
                <a href="{{ url_for('delete_category', cat_id=cat.id) }}" class="text-slate-400 hover:text-red-500 text-sm"><i class="fa-solid fa-trash"></i></a>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
