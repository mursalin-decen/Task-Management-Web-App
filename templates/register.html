{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-100 mt-12">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-800">Create Account</h2>
        <p class="text-sm text-slate-500">Register to get started</p>
    </div>
    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name / Username</label>
            <input type="text" name="username" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md shadow-indigo-100">Register</button>
    </form>
    <p class="text-center text-sm text-slate-600 mt-6">
        Already have an account? <a href="{{ url_for('login') }}" class="text-indigo-600 font-semibold hover:underline">Login here</a>
    </p>
</div>
{% endblock %}
